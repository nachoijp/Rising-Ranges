<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rising Ranges — 3D Glance</title>
    <link rel="icon" href="/icon.svg" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d1110;
        color: #ffffff;
        font: 16px/1.5 system-ui, sans-serif;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      iframe[hidden] {
        display: none;
      }
      #note {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        text-align: center;
      }
      #note[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="note"></div>
    <iframe id="vistazo" title="3D Glance" hidden></iframe>
    <script type="module" src="/src/vistazo/tabHost.ts"></script>
  </body>
</html>
